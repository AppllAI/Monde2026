name: Compilation iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/map-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler pour le simulateur iOS
        run: |
          set -o pipefail
          xcodebuild -project Monde2026.xcodeproj -scheme Monde2026 \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log || true
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log | sort -u | head -300 > errors.txt || true
          if grep -q "BUILD SUCCEEDED" build.log; then echo "OK" > status.txt; else echo "ECHEC" > status.txt; fi
          cat status.txt
          cat errors.txt

      - name: Lancer le jeu dans un simulateur d'iPad
        if: always()
        run: |
          mkdir -p /tmp/out
          if ! grep -q OK status.txt; then echo "pas de test : compilation échouée" > /tmp/out/run.txt; exit 0; fi
          APP="build/Build/Products/Release-iphonesimulator/Monde 2026.app"
          BUNDLE=com.brrrr999.monde2026
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['devices']
          ipads = [x for k, v in d.items() if 'iOS' in k for x in v if 'iPad' in x['name']]
          print(ipads[-1]['udid'] if ipads else '')")
          echo "Simulateur : $UDID" | tee /tmp/out/run.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          # 1. Test du moteur : 5 ans de simulation
          (xcrun simctl launch --console-pty "$UDID" $BUNDLE -selftest > selftest.log 2>&1 &)
          for i in $(seq 1 120); do sleep 5; grep -q "SELFTEST FIN" selftest.log && break; done
          grep -a "SELFTEST" selftest.log > /tmp/out/selftest.txt || true
          tail -c 20000 selftest.log > /tmp/out/selftest-raw.txt
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2

          # 2. Écran d'accueil
          xcrun simctl launch "$UDID" $BUNDLE
          sleep 8
          xcrun simctl io "$UDID" screenshot /tmp/out/1-accueil.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2

          # 3. Vue rapprochée (Ukraine sélectionnée, jeu en pause)
          xcrun simctl launch "$UDID" $BUNDLE -autostart FRA -speed 0 -inspect UKR
          sleep 20
          xcrun simctl io "$UDID" screenshot /tmp/out/2-zoom-ukraine.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2

          # 3b. Terrain, fiche d'armée, fiche de bataille (Ukraine, après 25 jours)
          xcrun simctl launch "$UDID" $BUNDLE -autostart FRA -speed 0 -mapmode Commerce -maptray
          sleep 15
          xcrun simctl io "$UDID" screenshot /tmp/out/5-terrain.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2
          xcrun simctl launch "$UDID" $BUNDLE -autostart FRA -speed 0 -panel industry
          sleep 15
          xcrun simctl io "$UDID" screenshot /tmp/out/8-industrie.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2
          xcrun simctl launch "$UDID" $BUNDLE -autostart FRA -speed 0 -mapmode Diplomatie -inspect UKR
          sleep 15
          xcrun simctl io "$UDID" screenshot /tmp/out/10-diplomatie.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2
          xcrun simctl launch "$UDID" $BUNDLE -autostart FRA -speed 0 -panel diplo
          sleep 15
          xcrun simctl io "$UDID" screenshot /tmp/out/11-troupes.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2
          xcrun simctl launch "$UDID" $BUNDLE -autostart FRA -speed 0 -panel army
          sleep 15
          xcrun simctl io "$UDID" screenshot /tmp/out/9-armee-panneau.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2
          xcrun simctl launch "$UDID" $BUNDLE -autostart UKR -speed 0 -advance 25 -selectarmy
          sleep 25
          xcrun simctl io "$UDID" screenshot /tmp/out/6-armee.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2
          xcrun simctl launch "$UDID" $BUNDLE -autostart UKR -speed 0 -advance 20 -openbattle
          sleep 25
          xcrun simctl io "$UDID" screenshot /tmp/out/7-bataille.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2
          xcrun simctl launch "$UDID" $BUNDLE -autostart UKR -speed 0 -advance 30 -openreport
          sleep 30
          xcrun simctl io "$UDID" screenshot /tmp/out/12-rapport.png
          xcrun simctl terminate "$UDID" $BUNDLE || true
          sleep 2

          # 4. Une partie en accéléré
          (xcrun simctl launch --console-pty "$UDID" $BUNDLE -autostart FRA -speed 3 -perf > game.log 2>&1 &)
          sleep 20
          xcrun simctl io "$UDID" screenshot /tmp/out/3-partie.png
          sleep 40
          xcrun simctl io "$UDID" screenshot /tmp/out/4-partie-1min.png
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"; then
            echo "Jeu toujours lancé après 1 minute : OK" | tee -a /tmp/out/run.txt
          else
            echo "Le jeu s'est fermé (crash ?)" | tee -a /tmp/out/run.txt
          fi
          sleep 40
          tail -c 30000 game.log > /tmp/out/game-console.txt || true
          for f in ~/Library/Logs/DiagnosticReports/*Monde*; do
            [ -f "$f" ] || continue
            python3 - "$f" >> /tmp/out/crash.txt <<'PY'
          import sys, json
          raw = open(sys.argv[1]).read()
          body = json.loads(raw.split("\n", 1)[1])
          print("=== CRASH", sys.argv[1])
          print("exception:", body.get("exception"))
          print("asi:", body.get("asi"))
          imgs = body.get("usedImages", [])
          ft = body.get("faultingThread", 0)
          for i, th in enumerate(body.get("threads", [])):
              if i != ft and i != 0:
                  continue
              print("--- thread", i, "(crash)" if i == ft else "", th.get("queue", ""))
              for fr in th.get("frames", [])[:40]:
                  ix = fr.get("imageIndex")
                  name = imgs[ix].get("name", "?") if ix is not None and ix < len(imgs) else "?"
                  print("  ", name, fr.get("symbol"), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
          done

      - name: Publier le résultat dans la branche ci-results
        if: always()
        run: |
          mkdir -p /tmp/out
          cp status.txt errors.txt /tmp/out/
          echo "${GITHUB_SHA}" > /tmp/out/commit.txt
          tail -c 200000 build.log > /tmp/out/build-tail.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-results
          git rm -rf . > /dev/null
          rm -rf build Monde2026.xcodeproj Monde2026 status.txt errors.txt build.log selftest.log
          cp /tmp/out/* .
          git add -A .
          git reset -q -- build Monde2026.xcodeproj 2>/dev/null || true
          git commit -m "Résultat de compilation ${GITHUB_SHA}"
          git push -f origin ci-results

      - name: Échouer si la compilation a échoué
        run: grep -q OK /tmp/out/status.txt
